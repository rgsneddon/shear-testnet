# The admit select tests build arity-32 transcripts on the test thread and
# overflow libtest's default 2 MiB stack.
[env]
RUST_MIN_STACK = "67108864"

# Rust's x86_64 Windows targets turn on SSE3 and CMPXCHG16B by default (the
# Linux target stops at SSE2), so rustc may emit them anywhere: it did, a
# haddpd in std's gimli Value::from_u64 in shear_admit.dll and shearadmit.node.
# Off here, at the x86-64 baseline. Release builds use fat LTO, so std's code
# is generated again under these flags. Nothing uses 128-bit atomics, and the
# Windows jobs refuse an __atomic_*_16 call in the shipped files. This is the
# only place the flag is set; tests/test_isa_baseline.js fails without it.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=-sse3,-cmpxchg16b"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=-sse3,-cmpxchg16b"]
