<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Shear documentation: wallet, mining, Vortex, vort1, The Reserve, node, pool, consensus."/>
  <script src="/brand/theme.js?v=14"></script>
  <title>Shear documentation</title>
  <link rel="icon" href="/brand/favicon-32.png" sizes="32x32"/>
  <link rel="icon" href="/brand/favicon.ico"/>
  <link rel="stylesheet" href="/brand/theme.css?v=27"/>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; max-width:100%; overflow-x:hidden; font:15px/1.4 "Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    a { color:var(--cyan); }
    .top-banner {
      display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; width:100%; min-height:44px; padding:6px 12px;
      border-bottom:1px solid rgba(26,111,181,.25); background:var(--banner);
      position:sticky; top:0; z-index:40;
    }
    .nav { display:flex; flex-wrap:nowrap; gap:6px; overflow-x:auto; }
    .banner-wordmark { height:36px; width:auto; max-width:none; display:block; }
    .banner-brand { display:flex; align-items:center; justify-self:start; min-width:unset; }
    .top-banner > .nav { justify-content:center; justify-self:center; min-width:unset; max-width:none; }
    a.nav-btn {
      display:inline-flex; align-items:center; justify-content:center; text-align:center; height:36px; padding:0 10px; color:var(--cyan); text-decoration:none;
      font-family:"Segoe UI",system-ui,sans-serif; font-weight:750; letter-spacing:.05em; font-size:.78rem; text-transform:uppercase;
      flex: none; width: auto;
      border:1px solid transparent;
      background: linear-gradient(165deg, #ffffff 0%, #eef5fb 58%) padding-box,
        linear-gradient(135deg, #4fd8e8, #4a9fe0, #5dcc7a) border-box;
      background-origin:border-box; background-clip:padding-box, border-box;
    }
    .docs-shell {
      display:grid; grid-template-columns: 19rem minmax(0,1fr);
      min-height: calc(100vh - var(--shear-banner-h, 52px));
    }
    .tree-pane {
      border-right:1px solid rgba(26,111,181,.22);
      background: var(--banner);
      padding: 12px 10px 32px;
      overflow:auto;
    }
    .tree-pane h2 {
      font-size:.72rem; letter-spacing:.08em; text-transform:uppercase;
      color:var(--muted); margin: 4px 8px 10px; font-weight:800;
    }
    .tree-search {
      width:100%; margin:0 0 10px; padding:.4rem .5rem;
      background:var(--input); color:var(--ink); border:1px solid var(--blue); font-size:16px;
    }
    .tree details.tree-folder { margin: 0 0 2px; }
    .tree summary {
      display:flex; align-items:center; gap:6px;
      cursor:pointer; list-style:none; padding:6px 8px; font-weight:750; font-size:.82rem;
      letter-spacing:.03em; color:var(--ink); user-select:none;
    }
    .tree summary::-webkit-details-marker { display:none; }
    .tree summary::marker { content:""; }
    .tree summary::before {
      content:"+"; display:inline-flex; width:1rem; justify-content:center;
      color:var(--muted); font-family: ui-monospace, Menlo, monospace; font-weight:800;
    }
    .tree details[open] > summary::before { content:"–"; }
    .tree .tree-kids { padding: 0 0 4px; }
    .tree a {
      display:block; padding:4px 8px 4px 22px; text-decoration:none; color:var(--cyan);
      font-size:.84rem; font-weight:650;
    }
    .tree a.is-on { color: var(--gold); background: rgba(26,111,181,.08); }
    .tree a:hover { color: var(--gold); }
    .read {
      padding: 18px 22px 64px;
      max-width: 48rem;
    }
    .read h1 { font-size:1.28rem; font-weight:800; margin:0 0 10px; }
    .read h2 { font-size:1.05rem; font-weight:800; margin:18px 0 8px; }
    .read h3 {
      font-size:.78rem; letter-spacing:.05em; text-transform:uppercase;
      color:var(--cyan); margin:14px 0 6px; font-weight:800;
    }
    .read p, .read li { line-height:1.55; margin:0 0 10px; }
    .read ul, .read ol { margin:0 0 12px; padding-left:1.2rem; }
    .read code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:.9em; background:var(--code); padding:.12em .35em; color:var(--green);
    }
    .read pre {
      margin:0 0 12px; padding:10px 12px; overflow:auto;
      background:var(--code); color:var(--ink);
      font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space:pre-wrap; word-break:break-word;
    }
    .read table { width:100%; border-collapse:collapse; margin: 4px 0 14px; font-size:.9rem; }
    .read th, .read td {
      text-align:left; padding:.45rem .2rem; vertical-align:top;
      border-bottom:1px solid rgba(26,111,181,.18);
    }
    .read th { color:var(--muted); font-size:.7rem; letter-spacing:.05em; text-transform:uppercase; width:34%; }
    .crumb { color:var(--muted); font-size:.78rem; margin:0 0 8px; }
    @media (max-width: 860px) {
      .docs-shell { grid-template-columns: 1fr; }
      .tree-pane { border-right:0; border-bottom:1px solid rgba(26,111,181,.22); max-height: 42vh; }
      .read { padding: 16px 12px 48px; }
    }
  </style>
</head>
<body>
  <header class="top-banner">
    <div class="banner-brand">
      <img id="shear-wordmark" class="banner-wordmark theme-img-light" alt="Shear"
        src="/brand/05c-wordmark-nevia-light-transparent.png"
        data-light="/brand/05c-wordmark-nevia-light-transparent.png"
        data-dark="/brand/05d-wordmark-nevia-dark-transparent.png"/>
      <img class="banner-wordmark theme-img-dark" alt=""
        src="/brand/05d-wordmark-nevia-dark-transparent.png"/>
    </div>
    <nav class="nav" id="shear-nav">
      <a class="nav-btn" href="https://shear.digital">MAIN</a>
      <a class="nav-btn" href="https://pool.shear.digital">POOL</a>
      <a class="nav-btn" href="https://explorer.shear.digital">EXPLORER</a>
      <a class="nav-btn" href="https://mempool.shear.digital">MEMPOOL</a>
      <a class="nav-btn" href="https://github.com/rgsneddon/ShearK/releases/tag/1.5" target="_blank" rel="noopener">MINER</a>
      <a class="nav-btn" href="https://github.com/rgsneddon/shear-testnet/tree/main/node" target="_blank" rel="noopener">NODE</a>
      <a class="nav-btn" href="https://github.com/rgsneddon/shear-testnet/releases/tag/0.26" target="_blank" rel="noopener">WALLET</a>
      <a class="nav-btn is-on" href="/">DOCS</a>
    </nav>
    <div class="banner-tools">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Dark" title="Dark" onclick="toggleShearTheme()">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></g></svg>
      </button>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="shear-nav" onclick="toggleShearNav()">Menu</button>
    </div>
  </header>
  <div class="docs-shell">
    <aside class="tree-pane" id="tree-pane">
      <h2>File tree</h2>
      <input class="tree-search" id="tree-search" type="search" placeholder="Filter pages" aria-label="Filter documentation"/>
      <nav class="tree" id="docs-tree"></nav>
    </aside>
    <article class="read" id="docs-read"></article>
  </div>
  <script src="content.js?v=4"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
