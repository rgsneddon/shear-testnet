[package]
name = "shear_admit"
version = "0.1.0"
edition = "2021"
description = "ADMITv2 Curve Trees (Pasta) + Bulletproofs+ (ristretto)"
license = "MIT"
publish = false

[lib]
name = "shear_admit"
# cdylib: Android arm64-v8a and desktop dart:ffi.
# staticlib: iOS wallet (`cargo ios-staticlib`, target aarch64-apple-ios).
# iOS is wallet-only: no node addon and no miner. CI does not sign that target.
crate-type = ["cdylib", "staticlib", "rlib"]

[package.metadata.shear]
ios = { target = "aarch64-apple-ios", crate-type = "staticlib", sign_ci = false }
android = { target = "aarch64-linux-android", crate-type = "cdylib", abi = "arm64-v8a" }

[dependencies]
pasta_curves = "0.5"
curve25519-dalek = { version = "4", features = ["digest", "rand_core", "legacy_compatibility"] }
sha2 = "0.10"
subtle = "2"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
group = "0.13"
ff = "0.13"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
