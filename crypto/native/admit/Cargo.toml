[package]
name = "shear_admit"
version = "0.1.0"
edition = "2021"
description = "ADMITv2 Curve Trees (Pasta) + Bulletproofs+ (ristretto)"
license = "MIT"
publish = false

[lib]
name = "shear_admit"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
pasta_curves = "0.5"
curve25519-dalek = { version = "4", features = ["digest", "rand_core", "legacy_compatibility"] }
sha2 = "0.10"
subtle = "2"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
group = "0.13"
ff = "0.13"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
