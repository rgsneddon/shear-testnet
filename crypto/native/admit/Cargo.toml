[package]
name = "shear_admit"
version = "0.1.0"
edition = "2021"
description = "ADMITv3 FS-1 spend (FCMP++ Selene/Helios), Pasta Curve Trees, Bulletproofs+ (ristretto)"
license = "MIT"
publish = false

[lib]
name = "shear_admit"
# cdylib: Android arm64-v8a and desktop dart:ffi.
# staticlib: iOS wallet (`cargo ios-staticlib`, target aarch64-apple-ios).
# iOS is wallet-only: no node addon and no miner. CI does not sign that target.
# No rlib: cargo runs LTO for a library only when every crate type can take
# it, and an rlib cannot, so with one listed `lto = true` below never ran.
# Nothing depends on this crate as an rlib (no tests/ dir, no Rust
# dependents). With LTO, dead std code goes, as the Windows build at the
# x86-64 baseline needs: core's unused 128-bit atomic Debug impls otherwise
# call __atomic_load_16, which nothing provides there.
crate-type = ["cdylib", "staticlib"]

[features]
default = []
# Node addon only. Wallet cdylib, iOS staticlib, and Android .so leave this off
# so shear_admit_prove_v3 / shear_admit_verify_v3 are not exported.
admit-v3 = []

[package.metadata.shear]
ios = { target = "aarch64-apple-ios", crate-type = "staticlib", sign_ci = false }
android = { target = "aarch64-linux-android", crate-type = "cdylib", abi = "arm64-v8a" }

[dependencies]
pasta_curves = "0.5"
curve25519-dalek = { version = "4", features = ["digest", "rand_core", "legacy_compatibility"] }
sha2 = "0.10"
subtle = "2"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
group = "0.13"
ff = "0.13"
# FS-1 spend: vendored monero-oxide FCMP++ (MIT), see vendor THIRD_PARTY_NOTICES.
shear-fs1 = { path = "../vendor/monero-oxide-77788c3/shear-fs1" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
