[workspace]
resolver = "2"
members = [
  "helioselene",
  "divisors",
  "generalized-bulletproofs",
  "fcmps",
  "fcmps/circuit-abstraction",
  "fcmps/ec-gadgets",
  "shear-fs1",
]

# The vendored crates set `workspace = true`. Empty tables keep that inheritance
# from turning into a missing-workspace error. Lint policy for those crates stays
# the upstream crate attributes.
[workspace.lints.rust]
[workspace.lints.clippy]

# One codegen unit and fat LTO let the vendored field and point code inline
# across crates. The 8-input prove is about 28% faster on x86_64.
[profile.release]
lto = "fat"
codegen-units = 1
