server {
    server_name donate.shear.digital;
    location ~* \.bak { return 404; }  # backups are never served (Russell 27 Oct)
    root /var/www/donate.shear.digital;
    index index.html;
    access_log /var/log/nginx/donate.shear.digital.access.log;
    gzip on;
    gzip_min_length 256;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    # connect-src lists every host the page may call; keep it in step with the disclosure on the page.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://shear.digital; style-src 'self' 'unsafe-inline' https://shear.digital; img-src 'self' data: https://shear.digital; connect-src 'self'; font-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "hid=(self), bluetooth=(self), clipboard-write=(self)" always;
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://shear.digital; style-src 'self' 'unsafe-inline' https://shear.digital; img-src 'self' data: https://shear.digital; connect-src 'self'; font-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ =404;
    }

    listen 127.0.0.1:8443 ssl;
    listen [::1]:8443 ssl;
    ssl_certificate /etc/letsencrypt/live/donate.shear.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donate.shear.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name donate.shear.digital;
    root /var/www/donate.shear.digital;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
