# Licence policy for every Rust workspace in this repo. Run from the root:
#   cargo deny --config deny.toml --manifest-path crypto/native/admit/Cargo.toml check licenses
#   cargo deny --config deny.toml --manifest-path crypto/native/vendor/monero-oxide-77788c3/Cargo.toml check licenses
# crypto/native/deny.toml keeps the [bans] that stop crates.io copies of the vendored FCMP++ crates.
# Copyleft and unknown licences fail. Adding one here needs a decision in docs/licensing-audit.md.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = false
