<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Vortices · Shear</title>
  <link rel="icon" href="https://shear.digital/brand/favicon-32.png" sizes="32x32"/>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('shear-theme');
        if (t !== 'dark' && t !== 'light') { t = 'dark'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="https://shear.digital/css/site.css" />
  <link rel="stylesheet" href="https://shear.digital/shared/shear-chrome.css" />
  <link rel="stylesheet" href="https://shear.digital/css/saas-dark.css" />
<style>
    body { margin: 0; background: var(--bg, #071422); color: var(--ink, #e8eef6); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; margin: 12px 0 4px; }
    .lead { margin: 0 0 16px; color: var(--muted, #9fb0c3); }
    article { border: 1px solid rgba(26,111,181,.35); padding: 12px; margin: 0 0 12px; background: rgba(8, 22, 40, .45); }
    h2 { margin: 0 0 6px; font-size: 1.05rem; }
    p { margin: 0 0 10px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    code { font-size: .85rem; word-break: break-all; }
    button, .nav-btn { font: inherit; }
    .status { font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; }
    form { display: grid; gap: 8px; }
    label { display: grid; gap: 4px; font-size: .85rem; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    .note { min-height: 1.2em; }
    .netline { margin: -8px 0 16px; color: var(--muted, #9fb0c3); font-size: .9rem; }
    .netline code { font-size: .85rem; }
  </style>
</head>
<body>
  <div id="shear-chrome-root" data-active="VORTICES" data-brand-base="https://shear.digital/brand/" data-testnet-pill="1"></div>
  <script src="https://shear.digital/shared/shear-chrome.js"></script>

  <div class="wrap">
    <h1>Vortices</h1>
    <p class="lead">Name, what it does, and one vort1 link. Paste that link into Continuum. No account.</p>
    <p class="netline" id="netline" aria-live="polite">Network · <code id="netmagic">shear-testnet-v5</code></p>
    <div id="list"></div>
    <article>
      <h2>Upload a vortex</h2>
      <form id="up">
        <label>Title <input name="title" required maxlength="80"/></label>
        <label>Explanation <textarea name="explanation" required maxlength="600" rows="4"></textarea></label>
        <label>vort1 link <input name="vort1" required placeholder="vort1:…"/></label>
        <label>Tag (optional) <input name="tag" maxlength="32"/></label>
        <button type="submit">Submit</button>
        <p class="note" id="note"></p>
      </form>
    </article>
  </div>
  <script>
    const list = document.getElementById('list');
    const note = document.getElementById('note');

    (function bindNetworkMagic() {
      var el = document.getElementById('netmagic');
      if (!el) return;
      var FALLBACK = 'shear-testnet-v5';
      fetch('https://pool.shear.digital/api/stats', { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('stats'); return r.json(); })
        .then(function (s) {
          var m = String((s && (s.magic || s.network)) || '').trim();
          el.textContent = m || FALLBACK;
        })
        .catch(function () { el.textContent = FALLBACK; });
    })();
    function card(row) {
      const art = document.createElement('article');
      const h = document.createElement('h2');
      h.textContent = row.name;
      const status = document.createElement('p');
      status.className = 'status';
      status.textContent = row.ready ? 'Ready' : (row.pending ? 'Pending' : 'Not Ready');
      const exp = document.createElement('p');
      exp.textContent = row.explanation;
      const line = document.createElement('div');
      line.className = 'row';
      const code = document.createElement('code');
      code.textContent = row.vort1;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'Copy vort1 link';
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(row.vort1);
          btn.textContent = 'Copied';
        } catch (e) {
          btn.textContent = 'Copy failed';
        }
        setTimeout(() => { btn.textContent = 'Copy vort1 link'; }, 1200);
      });
      line.append(code, btn);
      art.append(h, status, exp, line);
      if (row.href) {
        const more = document.createElement('p');
        const a = document.createElement('a');
        a.href = row.href;
        a.textContent = 'Explainer';
        more.append(a);
        art.append(more);
      }
      return art;
    }
    async function refresh() {
      const res = await fetch('/api/listings');
      const data = await res.json();
      list.replaceChildren(...(data.listings || []).map(card));
    }
    document.getElementById('up').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const body = Object.fromEntries(fd.entries());
      const res = await fetch('/api/listings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      note.textContent = res.ok ? 'Listed.' : (data.error || 'Upload failed.');
      if (res.ok) ev.target.reset();
      await refresh();
    });
    refresh();
  </script>
</body>
</html>
