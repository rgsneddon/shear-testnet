# Every test file that `npm test` names runs here, in one of the shards.
# tests/ci_shard.js plans the shards from tests/ci_timings.json. A file can
# leave the run only by a line in tests/ci_pending.txt that names the PR
# fixing it; the pending job fails on any other entry.
name: full-suite
on:
  # A PR branch runs once, as its pull_request. Base branches run on push.
  push:
    branches: [main, feat/shear-testnet-v12]
  pull_request:
# A newer commit on the same ref replaces the run still going.
concurrency:
  group: full-suite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pending:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pending list names a PR and a reason for every entry
        run: node tests/ci_shard.js --check
      - id: plan
        run: echo "shards=$(node tests/ci_shard.js --count 16)" >> "$GITHUB_OUTPUT"
  shard:
    needs: pending
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pending.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: Build the native modules (shearhash, shearadmit)
        run: |
          sudo apt-get update
          # mingw-w64: test_node_pack builds the Windows zip for real.
          sudo apt-get install -y build-essential cmake python3 mingw-w64
          cmake -S crypto/randomx -B crypto/randomx/build -DARCH=native
          cmake --build crypto/randomx/build -j"$(nproc)"
          make -C crypto/native -j"$(nproc)"
      - name: Build the fs1_tree tool
        working-directory: crypto/native/vendor/monero-oxide-77788c3
        run: |
          cargo build --release -p shear-fs1 --features tree-cli --bin fs1_tree
          echo "SHEAR_FS1_TREE_BIN=$PWD/target/release/fs1_tree" >> "$GITHUB_ENV"
          echo "SHEAR_FS1_TREE_SHA256=$(sha256sum target/release/fs1_tree | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Shard ${{ matrix.shard }} of 16
        run: |
          node tests/ci_shard.js --shard ${{ matrix.shard }} --of 16 > shard.txt
          echo "files: $(wc -l < shard.txt)"
          cat shard.txt
          test -s shard.txt
          # No --test-timeout: each file keeps its own cap.
          set +e
          node --test --test-concurrency=1 --test-reporter=tap $(cat shard.txt) | tee shard.tap
          rc=${PIPESTATUS[0]}
          set -e
          # A skipped or todo test is not a pass. The suite runs every test.
          skipped=$(grep -E '^# skipped ' shard.tap | tail -1 | awk '{print $3}')
          todo=$(grep -E '^# todo ' shard.tap | tail -1 | awk '{print $3}')
          if [ "${skipped:-x}" != 0 ] || [ "${todo:-x}" != 0 ]; then
            echo "::error::shard has skipped=${skipped:-?} todo=${todo:-?}; every test must run"
            grep -E '# (SKIP|TODO)' shard.tap || true
            exit 1
          fi
          exit "$rc"
