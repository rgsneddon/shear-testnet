# Fails when the Reserve pin, the admin-free bytecode, or the vault security map moves.
name: reserve-pin
on:
  push:
  pull_request:
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install node deps
        run: npm ci
      - name: Reserve pin, bytecode admin check, and vault security map
        run: node --test --test-concurrency=1 crypto/reserve_evm.test.js node/tests/test_vault_security_map.js node/tests/test_oracle_seal_v12.js
