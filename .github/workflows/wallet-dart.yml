# Wallet Dart unit tests. Builds libshearhash.so, installs npm dependencies,
# then runs the clock, flyclient, and reserve unit tests. Not the widget suite.
name: wallet-dart
on:
  push:
    paths:
      - '.github/workflows/wallet-dart.yml'
      - 'wallet/**'
      - 'crypto/native/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/wallet-dart.yml'
      - 'wallet/**'
      - 'crypto/native/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Build libshearhash.so
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 g++
          bash crypto/native/build-shearhash-wallet.sh
          test -f crypto/native/libshearhash.so
          test -f crypto/native/libshearhash.so.sha256
      - name: Install npm dependencies
        run: npm ci
      - name: Wallet Dart unit tests
        working-directory: wallet
        run: |
          set -euo pipefail
          flutter pub get
          flutter test \
            test/unlock_clock_test.dart \
            test/flyclient_tip_test.dart \
            test/reserve_clock_unit_test.dart
