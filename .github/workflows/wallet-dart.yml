# Pure Dart wallet tests. The vote plan, the leaf-vote fee note, and the
# funded withdraw builder. Flutter is the SDK that resolves this package.
name: wallet-dart
on:
  pull_request:
  push:
    branches:
      - feat/shear-testnet-v12
      - cursor/vault-fs1-funding-66bd

jobs:
  dart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dart vote plan, leaf vote, and withdraw builder
        working-directory: wallet
        run: |
          flutter pub get
          flutter test test/shear_vote_plan_test.dart
      - name: JS verifies a Dart-built withdraw
        run: |
          npm ci --ignore-scripts
          node --test crypto/dart_withdraw_verify.test.js
