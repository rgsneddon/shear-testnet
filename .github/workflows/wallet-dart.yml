# Wallet tests. The vote plan, the leaf-vote fee note, and a Dart withdraw
# that the JS FS-1 verifier checks. Flutter resolves the package. The
# verifier needs shearadmit.node, which this job builds.
name: wallet-dart
on:
  pull_request:
  push:
    branches:
      - feat/shear-testnet-v12
      - cursor/vault-fs1-funding-66bd

jobs:
  dart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Dart vote plan, leaf vote, and withdraw builder
        working-directory: wallet
        run: |
          flutter pub get
          flutter test test/shear_vote_plan_test.dart
      - name: Admit library the withdraw prover loads
        run: cargo build --release --manifest-path crypto/native/admit/Cargo.toml
      - name: UI leaf vote posts a real proof
        working-directory: wallet
        run: flutter test test/leaf_vote_wire_test.dart
      - name: Install node deps
        run: npm ci --ignore-scripts
      - name: Build shearadmit.node
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          VER=$(node -p process.version)
          mkdir -p .node-headers
          base="https://nodejs.org/dist/${VER}"
          curl -fsSL "${base}/SHASUMS256.txt" -o .node-headers/SHASUMS256.txt
          curl -fsSL "${base}/node-${VER}-headers.tar.gz" -o ".node-headers/node-${VER}-headers.tar.gz"
          grep -E "[[:space:]]node-${VER}-headers\\.tar\\.gz$" .node-headers/SHASUMS256.txt > .node-headers/headers.sha256
          test "$(wc -l < .node-headers/headers.sha256)" -eq 1
          (cd .node-headers && sha256sum -c headers.sha256)
          tar -xzf ".node-headers/node-${VER}-headers.tar.gz" -C .node-headers
          export NODE_INC="$(pwd)/.node-headers/node-${VER}/include/node"
          test -f "$NODE_INC/node_api.h"
          make -C crypto/native shearadmit.node NODE_INC="$NODE_INC"
          test -f crypto/native/shearadmit.node
          node -e 'const n = require("module").createRequire(process.cwd()+"/")("./crypto/native/shearadmit.node"); if (!n || typeof n.fs1Verify !== "function") throw new Error("shearadmit");'
      - name: JS verifies a Dart-built withdraw
        run: node --test crypto/dart_withdraw_verify.test.js
