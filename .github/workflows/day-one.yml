# Day-one robustness. Request faults, the datadir lock, solo caps, and CLI amounts.
name: day-one
on:
  push:
  pull_request:
jobs:
  node:
    # ubuntu-latest (the ubuntu-26.04 image) sets APT::Architecture-Variants
    # "amd64v3", so its gcc defaults to x86-64-v3 and its static libstdc++ and
    # libgcc are AVX2 builds that no -march flag can undo. ubuntu-24.04 builds
    # at the x86-64 baseline; scripts/isa_scan.py fails the job if that drifts.
    # Proven fallback: the ubuntu:26.04 container (baseline toolchain).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install node deps
        run: npm ci --ignore-scripts
      - name: Build ShearHash and admit addons
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3
          bash scripts/randomx_build.sh
          make -C crypto/native shearhash.node shearadmit.node
          python3 scripts/isa_scan.py crypto/randomx/build/librandomx.a crypto/native/shearhash.node crypto/native/shearadmit.node
      - name: RPC, solo, datadir lock, process guard, mine worker, p2p idle
        run: >
          node --test --test-concurrency=1 --test-timeout=180000
          node/tests/test_rpc_fuzz.js
          node/tests/test_solo_robust.js
          node/tests/test_datadir_lock.js
          node/tests/test_process_guard.js
          node/tests/test_mine_worker_fault.js
          node/tests/test_p2p_idle.js
          node/tests/test_feed_fault.js
          node/tests/test_fork_claim_loop_v12.js
          node/tests/test_book_magic_admit_v12.js
          pool/tests/test_pool_datadir.js
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: CLI amount parsing
        working-directory: wallet
        run: |
          flutter pub get
          flutter test test/cli_amount_test.dart
