name: shear-fs1
on:
  push:
  pull_request:
jobs:
  crate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: crypto/native/vendor/monero-oxide-77788c3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Normal dependencies do not enable the insecure generators
        run: |
          gbp() { cargo tree --color never -p shear-fs1 -e normal --prefix none -f '{p} {f}' "$@" | grep '^generalized-bulletproofs v'; }
          for features in "" "--features=bench" "--features=tree-cli"; do
            gbp $features
            if gbp $features | grep -E '[ ,]tests(,|$| )'; then
              echo "generalized-bulletproofs/tests reached a normal build ($features)"
              exit 1
            fi
          done
          gbp --features=insecure-test-generators | grep -E '[ ,]tests(,|$| )'
      - name: Release build has no bench or tree binary
        run: |
          rm -f target/release/fs1_bench target/release/fs1_tree
          cargo build --release -p shear-fs1 --bins
          test ! -e target/release/fs1_bench
          test ! -e target/release/fs1_tree
      - name: 64-bit Android type-checks
        run: cargo check --release -p shear-fs1 --target aarch64-linux-android
      - name: Debug tests
        run: cargo test -p shear-fs1
      - name: Release tests, depth 7 and 2^20 trees, chain tree vector, dudect timing
        run: cargo test -p shear-fs1 --release --features insecure-test-generators
  node-routes:
    runs-on: ubuntu-latest
    # Adopt, parity, frontier burial, and the full p2p file are each a
    # long native run. 60 minutes no longer covers them with the lane tests.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: Build the native modules (shearhash, shearadmit)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3
          cmake -S crypto/randomx -B crypto/randomx/build -DARCH=native
          cmake --build crypto/randomx/build -j"$(nproc)"
          make -C crypto/native -j"$(nproc)"
          node -e 'const r = require("module").createRequire(process.cwd() + "/"); for (const m of ["shearhash", "shearadmit"]) { const n = r("./crypto/native/" + m + ".node"); if (!n || !Object.keys(n).length) throw new Error(m); }'
      - name: Vault qualification, autocredit, and FS-1 lock identity, with shearadmit
        run: node --test --test-concurrency=1 --test-timeout=180000 crypto/reserve_vault.test.js crypto/reserve_autocredit.test.js
      - name: FS-1 Stage 0 send gate, with the native modules
        run: node --test node/tests/test_fs1_send_gate_v12.js
      - name: Consensus admit set against the FS-1 leaf set
        run: node --test node/tests/test_fs1_admit_divergence.js
      - name: Sequential IBD and the tip-extend header gate, with the native modules
        run: node --test --test-concurrency=1 --test-timeout=600000 node/tests/test_ibd_sequential.js node/tests/test_tip_extend_gate_v12.js
      - name: Build the fs1_tree tool
        working-directory: crypto/native/vendor/monero-oxide-77788c3
        run: |
          cargo build --release -p shear-fs1 --features tree-cli --bin fs1_tree
          echo "SHEAR_FS1_TREE_SHA256=$(sha256sum target/release/fs1_tree | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - run: node --test node/tests/test_fs1_sync_routes.js
      - name: FS-1 tree follower, roots against the shared vector
        env:
          FS1_TREE_REQUIRED: '1'
          SHEAR_FS1_TREE_BIN: ${{ github.workspace }}/crypto/native/vendor/monero-oxide-77788c3/target/release/fs1_tree
        run: node --test node/tests/test_fs1_tree.js
      - run: node --test crypto/fs1_pin.test.js
      - name: FS-1 verify and root caches refuse stale passes
        run: node --test crypto/fs1_verify_cache.test.js crypto/fs1_spend.test.js
      - name: Shipped withdraws, one past the retire cap
        run: node --test node/tests/test_withdraw_ship_v12.js
      - name: Fresh peer sync and restart across lock, claim, vote, and withdraw
        run: node --test node/tests/test_vault_sync_restart_v12.js
      - name: Fingerprint pins, admit keys, portal, owner, leak, snap, claim bound
        run: node --test --test-concurrency=1 crypto/asert.test.js node/tests/test_admit_keys_v12.js node/tests/test_portal_per_lock_v12.js node/tests/test_lock_owner_bind_v12.js node/tests/test_lock_replay_auth_v12.js node/tests/test_withdraw_leak_v12.js node/tests/test_snap_fill_linear_v12.js node/tests/test_claim_mint_bound_v12.js node/tests/test_p2p_fingerprint_v12.js
      - name: Hash bonus law, including the JS and EVM 1 to 2 to 3 pin
        run: node --test --test-concurrency=1 --test-timeout=1800000 crypto/leaf_vote.test.js
      - name: Flutter for the Dart withdraw body
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Wallet package for the withdraw emitter
        working-directory: wallet
        run: flutter pub get
      - name: Admit library the Dart withdraw prover loads
        run: cargo build --release --manifest-path crypto/native/admit/Cargo.toml
      - name: Dart-built withdraw is accepted by the node queue
        run: node --test --test-concurrency=1 --test-timeout=1800000 node/tests/test_dart_withdraw_queue_v12.js
      - name: Hash-bonus unit stays the law clamp, and a retired vote does not move it
        run: node --test --test-concurrency=1 --test-timeout=180000 node/tests/test_hash_owed_recover_v12.js
      - name: Privacy walk, including the compact reserve key check
        run: node --test --test-concurrency=1 tests/privacy.walk.js
      - name: Pool refuses a lock that carries to
        run: node --test --test-concurrency=1 pool/tests/test_wallet_send.js
      - name: A rejected or retagged fund body cannot satisfy another tx
        run: node --test --test-concurrency=1 --test-timeout=1800000 node/tests/test_fund_verdict_v12.js
      - name: k reserve txs cost one apply each
        run: node --test --test-concurrency=1 --test-timeout=1800000 node/tests/test_reserve_trial_v12.js
      - name: Supply stays verified after a real lock, vote, and withdraw
        run: node --test --test-concurrency=1 --test-timeout=1800000 node/tests/test_admit_v3_fund_v12.js
      - name: Vault parity, including the unowned vote fee
        run: node --test --test-concurrency=1 --test-timeout=1800000 node/tests/test_vault_parity_v12.js
      - name: Heavier branch that changes the hash-bonus unit is adopted
        run: node --test --test-concurrency=1 --test-timeout=2700000 node/tests/test_adopt_unit_v12.js
      - name: Lock anchored before the side tip still verifies
        run: node --test --test-concurrency=1 --test-timeout=2700000 node/tests/test_frontier_burial_v12.js
      - name: P2P, including the FS-1 leaf vote that paints pending
        run: node --test --test-concurrency=1 --test-timeout=2700000 node/tests/test_p2p.js
