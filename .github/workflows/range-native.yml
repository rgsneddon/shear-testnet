name: range-native
on:
  push:
  pull_request:
jobs:
  bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build shearadmit.node
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          npm ci --ignore-scripts
          VER=$(node -p process.version)
          mkdir -p .node-headers
          curl -fsSL "https://nodejs.org/dist/${VER}/node-${VER}-headers.tar.gz" | tar -xz -C .node-headers
          export NODE_INC="$(pwd)/.node-headers/node-${VER}/include/node"
          test -f "$NODE_INC/node_api.h"
          make -C crypto/native shearadmit.node NODE_INC="$NODE_INC"
          test -f crypto/native/shearadmit.node
      - name: Native range bytes and fail-closed policy
        run: node --test --test-timeout 180000 crypto/range_packed.test.js crypto/range_js_policy.test.js
