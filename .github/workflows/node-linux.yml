# Linux-family Shear Sentinel v12 zips. Native addon is built on ubuntu-latest.
# Arch, Fedora, and OpenSUSE zips use that same Linux addon and the runner's node.
# Does not upload, and does not move tag v7.
name: node-linux
on:
  workflow_dispatch:
    inputs:
      label:
        description: Node release label (v10)
        required: true
        default: 'v12'

jobs:
  linux:
    # ubuntu-latest (the ubuntu-26.04 image) sets APT::Architecture-Variants
    # "amd64v3", so its gcc defaults to x86-64-v3 and its static libstdc++ and
    # libgcc are AVX2 builds that no -march flag can undo. ubuntu-24.04 builds
    # at the x86-64 baseline; scripts/isa_scan.py fails the job if that drifts.
    # Proven fallback: the ubuntu:26.04 container (baseline toolchain).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ShearHash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3
          bash scripts/randomx_build.sh
          make -C crypto/native
          python3 scripts/isa_scan.py crypto/randomx/build/librandomx.a crypto/native/shearhash.node crypto/native/shearadmit.node
      - name: Install node deps
        run: npm ci --ignore-scripts
      - name: Pack linux, arch, fedora, opensuse
        env:
          SHEAR_NODE_PACK_LABEL: ${{ inputs.label }}
          SHEAR_NODE_PACK_DEPS: '1'
        run: |
          for flavor in linux archlinux fedora opensuse; do
            python3 node/pack/zip_node.py "$flavor"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: shear-node-${{ inputs.label }}-linux-family
          path: |
            dist/shear-node-${{ inputs.label }}-linux.zip
            dist/shear-node-${{ inputs.label }}-archlinux.zip
            dist/shear-node-${{ inputs.label }}-fedora.zip
            dist/shear-node-${{ inputs.label }}-opensuse.zip
