# Pack Shear Sentinel Arch and openSUSE zips inside those distros.
# The native addons and the bundled node come from the image, then the zip
# is uploaded to the existing v14 release. This does not retag and does not
# replace the Windows, Linux, or Fedora assets.
name: node-arch-opensuse
on:
  workflow_dispatch:
    inputs:
      flavors:
        description: Space-separated flavors to pack (archlinux, opensuse)
        required: false
        default: archlinux opensuse

concurrency:
  group: node-arch-opensuse-${{ inputs.flavors }}
  cancel-in-progress: false

jobs:
  choose:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          FLAVORS: ${{ inputs.flavors }}
        run: |
          python3 - << 'PY'
          import json, os
          images = {
              "archlinux": "archlinux:base",
              "opensuse": "opensuse/tumbleweed",
          }
          wanted = os.environ.get("FLAVORS", "").split()
          include = []
          for flavor in wanted:
              if flavor not in images:
                  raise SystemExit(f"unknown flavor {flavor}")
              include.append({"flavor": flavor, "image": images[flavor]})
          if not include:
              raise SystemExit("no flavors")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("include=" + json.dumps(include) + "\n")
          PY

  pack:
    needs: choose
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.choose.outputs.include) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and pack inside the distro image
        run: |
          cat > "$RUNNER_TEMP/pack-distro.sh" << 'ENDSCRIPT'
          #!/bin/bash
          set -euo pipefail
          echo "FLAVOR=$FLAVOR"
          cat /etc/os-release
          case "$FLAVOR" in
            archlinux)
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel cmake nodejs npm rust python git file
              ;;
            opensuse)
              zypper -n refresh
              zypper -n install gcc gcc-c++ make cmake nodejs npm nodejs-devel rust cargo python3 git zip gzip tar pkg-config file
              ;;
            *)
              echo "unknown flavor $FLAVOR" >&2
              exit 1
              ;;
          esac
          if ! command -v python3 >/dev/null 2>&1; then
            ln -sf "$(command -v python)" /usr/local/bin/python3
          fi
          command -v node
          command -v cargo
          command -v python3
          node -p "process.version"
          rustc --version
          NODE_INC=""
          for d in /usr/include/node /usr/local/include/node /usr/include/node26 /usr/include/node24 /usr/include/node22 /usr/include/node20; do
            if [ -f "$d/node_api.h" ]; then
              if [ "$d" != /usr/include/node ] && [ ! -e /usr/include/node ]; then
                ln -sfn "$d" /usr/include/node
              fi
              if [ -f /usr/include/node/node_api.h ]; then
                NODE_INC=/usr/include/node
              else
                NODE_INC="$d"
              fi
              break
            fi
          done
          if [ -z "${NODE_INC}" ]; then
            echo "node headers:" >&2
            ls -d /usr/include/node* >&2 || true
            echo "node_api.h missing" >&2
            exit 1
          fi
          echo "NODE_INC $NODE_INC"
          test -f "$NODE_INC/node_api.h"
          export NODE_INC

          cd /src
          rm -rf runtime node_modules dist crypto/randomx/build \
            crypto/native/shearhash.node crypto/native/shearadmit.node \
            crypto/native/admit/target
          npm ci
          cmake -S crypto/randomx -B crypto/randomx/build
          cmake --build crypto/randomx/build -j"$(nproc)"
          make -C crypto/native -j"$(nproc)"
          test -f crypto/native/shearhash.node
          test -f crypto/native/shearadmit.node
          file crypto/native/shearhash.node
          file crypto/native/shearadmit.node
          python3 - << 'PY'
          import os, shutil, subprocess
          from pathlib import Path
          real = Path(os.path.realpath(shutil.which("node")))
          print("NODE_REAL", real, real.stat().st_size)
          runtime = Path("/src/runtime")
          if runtime.exists():
              shutil.rmtree(runtime)
          runtime.mkdir()
          ldd = subprocess.check_output(["ldd", str(real)], text=True, stderr=subprocess.STDOUT)
          print(ldd)
          keep = ("libnode", "libstdc++", "libgcc_s", "libuv")
          libs = []
          for line in ldd.splitlines():
              if "=>" not in line:
                  continue
              parts = line.split()
              if len(parts) < 3 or not parts[2].startswith("/"):
                  continue
              lib = Path(parts[2])
              if lib.name.startswith(keep):
                  libs.append(lib)
          if libs:
              shutil.copy2(real, runtime / "node.bin")
              for lib in libs:
                  shutil.copy2(lib, runtime / lib.name)
              (runtime / "node").write_text(
                  "#!/bin/sh\n"
                  "HERE=$(CDPATH= cd -- \"$(dirname \"$0\")\" && pwd)\n"
                  "export LD_LIBRARY_PATH=\"$HERE${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\"\n"
                  "exec \"$HERE/node.bin\" \"$@\"\n"
              )
              os.chmod(runtime / "node", 0o755)
              os.chmod(runtime / "node.bin", 0o755)
              print("BUNDLED_LIBS", " ".join(lib.name for lib in libs))
          else:
              shutil.copy2(real, runtime / "node")
              os.chmod(runtime / "node", 0o755)
              print("BUNDLED_PLAIN", (runtime / "node").stat().st_size)
          PY
          /src/runtime/node -p "process.version"
          export SHEAR_NODE_PACK_LABEL=v14
          python3 node/pack/zip_node.py "$FLAVOR"
          ZIP="dist/shear-node-v14-${FLAVOR}.zip"
          test -f "$ZIP"

          rm -rf /tmp/smoke
          mkdir -p /tmp/smoke
          python3 -m zipfile -e "$ZIP" /tmp/smoke
          test -f /tmp/smoke/runtime/node
          test -f /tmp/smoke/crypto/native/shearhash.node
          test -f /tmp/smoke/crypto/native/shearadmit.node
          chmod +x /tmp/smoke/runtime/node
          if [ -f /tmp/smoke/runtime/node.bin ]; then chmod +x /tmp/smoke/runtime/node.bin; fi
          test "$(stat -c%s "$ZIP")" -gt 20000000
          SYS_VER=$(node -p "process.version")
          PACK_VER=$(/tmp/smoke/runtime/node -p "process.version")
          echo "SYS_VER=$SYS_VER PACK_VER=$PACK_VER"
          test "$SYS_VER" = "$PACK_VER"
          grep -q "export const PRODUCT_VERSION = '14.0';" /tmp/smoke/crypto/asert.js
          grep -q "shear-testnet-v9" /tmp/smoke/crypto/asert.js
          HASH=$(cd /tmp/smoke && ./runtime/node --input-type=module -e '
          import { createRequire } from "node:module";
          const req = createRequire(import.meta.url);
          const n = req("./crypto/native/shearhash.node");
          const a = req("./crypto/native/shearadmit.node");
          if (typeof n.hash !== "function") throw new Error("shearhash has no hash");
          if (typeof a.noteH !== "function") throw new Error("shearadmit has no noteH");
          n.backend("interpreter");
          const out = n.hash(Buffer.alloc(128, 0x11));
          if (!Buffer.isBuffer(out) || out.length !== 32) throw new Error("hash length");
          console.log(out.toString("hex"));
          ')
          case "$HASH" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "smoke hash was not hex: $HASH" >&2; exit 1 ;;
          esac
          {
            echo "FLAVOR=$FLAVOR"
            . /etc/os-release
            echo "PRETTY_NAME=$PRETTY_NAME"
            echo "ID=$ID"
            echo "NODE=$(node -p process.version)"
            echo "RUSTC=$(rustc --version)"
            sha256sum crypto/native/shearhash.node crypto/native/shearadmit.node
            echo "HASH_OK $HASH"
            echo "ZIP_BYTES=$(wc -c < "$ZIP")"
            echo "PACK_OK"
          } | tee "dist/build-proof-${FLAVOR}.txt"
          ENDSCRIPT
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -v "$RUNNER_TEMP/pack-distro.sh":/pack-distro.sh:ro \
            -e FLAVOR="${{ matrix.flavor }}" \
            "${{ matrix.image }}" \
            bash /pack-distro.sh

      - uses: actions/upload-artifact@v4
        with:
          name: proof-${{ matrix.flavor }}
          path: |
            dist/build-proof-${{ matrix.flavor }}.txt
            dist/shear-node-v14-${{ matrix.flavor }}.zip

      - name: Upload the zip to the v14 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="$GITHUB_WORKSPACE/dist/shear-node-v14-${{ matrix.flavor }}.zip"
          test -f "$ZIP"
          grep -q PACK_OK "$GITHUB_WORKSPACE/dist/build-proof-${{ matrix.flavor }}.txt"
          for i in 1 2 3 4 5 6; do
            if gh release upload v14 "$ZIP" --repo rgsneddon/shear-testnet; then
              exit 0
            fi
            echo "upload attempt $i failed, retrying"
            sleep $((i * 20))
          done
          exit 1
