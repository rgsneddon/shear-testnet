# Confirm shewall.bin ACL behavior on a real Windows runner.
# The production SDDL string has a space between the owner and the DACL.
# This job does not build or publish a wallet.
name: wallet-shewall-windows
on:
  pull_request:
  push:
    branches:
      - cursor/shewall-bin-acl-5879
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: shewall ACL tests
        working-directory: wallet
        run: flutter test test/shewall_acl_test.dart
      - name: Windows shewall.bin save/load and SDDL
        working-directory: wallet
        run: flutter test test/shewall_windows_ci_test.dart
