# ShearK-Miner macOS pack. No Mac host has packed or checked this zip yet
# (Apple work is tracked in the Desktop HANDOFF), so it runs only when
# started by hand and never appears as a skipped check on a PR.
name: sheark-macos
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pack version
        run: echo "SHEARK_VER=$(sed -n 's/^#define SHEAR_VERSION "\([^"]*\)".*/\1/p' sheark-miner/src/shear_hash.h)" >> "$GITHUB_ENV"
      - name: Build, selftest, and pack the macOS zip
        run: |
          set -euo pipefail
          test -n "$SHEARK_VER"
          brew install openssl cmake libsodium
          PREFIX="$(brew --prefix openssl)"
          SODIUM="$(brew --prefix libsodium)"
          test -f "$PREFIX/include/openssl/ssl.h"
          test -f "$SODIUM/include/sodium.h"
          make -C sheark-miner OPENSSL_PREFIX="$PREFIX" SODIUM_PREFIX="$SODIUM"
          bash sheark-miner/pack/selftest.sh sheark-miner/ShearK-Miner
          # R41: every backend gives the 64 golden digests of the R28 base.
          node --test sheark-miner/tests/test_golden_corpus_v12.js
          python3 sheark-miner/pack/zip_unix.py macos
          bash sheark-miner/pack/smoke_zip.sh "dist/ShearK-Miner-${SHEARK_VER}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ShearK-Miner-${{ env.SHEARK_VER }}-macos
          path: dist/ShearK-Miner-${{ env.SHEARK_VER }}-macos.zip
          if-no-files-found: error

