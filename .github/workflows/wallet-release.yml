# Every wallet tag ships GUI + CLI executables for each platform.
# Dispatch after tagging the pin on rgsneddon/shear-wallet (preferred)
# or this monorepo. Do not attach these zips to 0.33 / 0.32.
name: wallet-release
on:
  workflow_dispatch:
    inputs:
      pin:
        description: Public two-part wallet pin (release tag)
        required: true
        default: '0.70'
      build_number:
        description: Flutter build-number
        required: true
        default: '95'
      repo:
        description: GitHub repo that owns the release
        required: true
        default: 'rgsneddon/shear-testnet'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      # The zip carries the node sidecar, so its addons and node_modules are
      # built here. shear_admit.dll and the addons come from the GNU Rust
      # toolchain and MSYS2 UCRT64 gcc (as node-v17.yml packs the node): those
      # DLLs keep a symbol table, so scripts/isa_scan.py can check every
      # function. The MSVC linker keeps none.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Node sidecar addons, GNU toolchain
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          VER=$(node -p process.version)
          rm -rf .node-headers && mkdir -p .node-headers
          curl -fsSL "https://nodejs.org/dist/${VER}/node-${VER}-headers.tar.gz" | tar -xz -C .node-headers
          export NODE_INC="$(pwd)/.node-headers/node-${VER}/include/node"
          test -f "$NODE_INC/node_api.h"
          npm ci --ignore-scripts
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup override set stable-x86_64-pc-windows-gnu
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc
          bash scripts/randomx_build.sh -G "MinGW Makefiles"
          make -C crypto/native
          test -f crypto/native/shearhash.node
          test -f crypto/native/shearadmit.node
      - name: Build Windows GUI + CLI
        working-directory: wallet
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          rustup override set stable-x86_64-pc-windows-gnu
          flutter config --enable-windows-desktop
          flutter pub get
          dart run tool/checkpoint_guard.dart --release
          cargo build --release --manifest-path ../crypto/native/admit/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $define = (python ../crypto/native/stamp_admit_pin.py --define ../crypto/native/admit/target/release/shear_admit.dll).Trim()
          flutter build windows --release --build-name=${{ inputs.pin }}.0 --build-number=${{ inputs.build_number }} $define
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist-cli | Out-Null
          cmd /c "dart compile exe bin/shear.dart -o dist-cli/shear.exe & exit /b 0"
      - name: No code above the x86-64 baseline in the native libraries
        run: |
          $env:OBJDUMP = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\objdump.exe"
          python scripts/isa_scan.py wallet/native/shear_v3.dll crypto/randomx/build-win/librandomx.a crypto/native/admit/target/release/shear_admit.dll crypto/native/shearhash.node crypto/native/shearadmit.node crypto/randomx/build/librandomx.a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip GUI
        run: python wallet/pack/zip_windows.py
      - name: Refuse a Windows zip without shear_v3.dll
        run: python wallet/pack/check_shear_v3_bundled.py wallet/dist/shear-wallet-${{ inputs.pin }}-windows.zip
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ inputs.pin }} wallet/dist/shear-wallet-${{ inputs.pin }}-windows.zip --repo ${{ inputs.repo }}
          if (Test-Path wallet/dist-cli/shear.exe) { gh release upload ${{ inputs.pin }} wallet/dist-cli/shear.exe --repo ${{ inputs.repo }} }

  linux:
    # ubuntu-latest (the ubuntu-26.04 image) sets APT::Architecture-Variants
    # "amd64v3", so its gcc defaults to x86-64-v3 and its static libstdc++ and
    # libgcc are AVX2 builds that no -march flag can undo. ubuntu-24.04 builds
    # at the x86-64 baseline; scripts/isa_scan.py fails the job if that drifts.
    # Proven fallback: the ubuntu:26.04 container (baseline toolchain).
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Build Linux GUI + CLI
        working-directory: wallet
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev g++ libsecret-1-dev
          gcc_major="$(clang++ -print-file-name=libstdc++.so | sed -n 's|.*/\([0-9][0-9]*\)/libstdc++.so|\1|p')"
          sudo apt-get install -y "libstdc++-${gcc_major}-dev"
          flutter config --enable-linux-desktop
          flutter pub get
          dart run tool/checkpoint_guard.dart --release
          bash ../crypto/native/build-linux-admit-so.sh
          DEFINE="$(python3 ../crypto/native/stamp_admit_pin.py --define ../crypto/native/admit/target/release/libshear_admit.so)"
          flutter build linux --release --build-name=${{ inputs.pin }}.0 --build-number=${{ inputs.build_number }} $DEFINE
          mkdir -p dist-cli
          dart compile exe bin/shear.dart -o dist-cli/shear || true
          python3 ../scripts/isa_scan.py ../wallet/native/libshear_v3.so ../crypto/randomx/build/librandomx.a ../crypto/native/admit/target/release/libshear_admit.so
      - name: Continuum release signing
        working-directory: wallet/android
        env:
          CONTINUUM_STORE_PASSWORD: ${{ secrets.CONTINUUM_STORE_PASSWORD }}
          CONTINUUM_KEY_PASSWORD: ${{ secrets.CONTINUUM_KEY_PASSWORD }}
          CONTINUUM_KEYSTORE_B64: ${{ secrets.CONTINUUM_KEYSTORE_B64 }}
        run: |
          if [ -z "$CONTINUUM_STORE_PASSWORD" ] || [ -z "$CONTINUUM_KEY_PASSWORD" ] || [ -z "$CONTINUUM_KEYSTORE_B64" ]; then
            echo "Missing wallet/android/key.properties. Release assemble refuses the debug cert."
            exit 1
          fi
          umask 077
          printf '%s' "$CONTINUUM_KEYSTORE_B64" | base64 -d > continuum-release.jks
          {
            echo "storePassword=$CONTINUUM_STORE_PASSWORD"
            echo "keyPassword=$CONTINUUM_KEY_PASSWORD"
            echo "keyAlias=continuum"
            echo "storeFile=../continuum-release.jks"
          } > key.properties
      - name: Pin NDK r27d (reproducible libsodium.so, see wallet/android/libsodium.lock.json)
        run: |
          set -euo pipefail
          sudo apt-get install -y minisign
          if [[ ! -f /opt/android-ndk-r27d/source.properties ]]; then
            curl -fsSL -o /tmp/android-ndk-r27d-linux.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
            echo "22105e410cf29afcf163760cc95522b9fb981121  /tmp/android-ndk-r27d-linux.zip" | sha1sum -c
            echo "601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9  /tmp/android-ndk-r27d-linux.zip" | sha256sum -c
            sudo unzip -q /tmp/android-ndk-r27d-linux.zip -d /opt
          fi
          grep -q 'Pkg.ReleaseName = r27d' /opt/android-ndk-r27d/source.properties
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r27d" >> "$GITHUB_ENV"
          echo "SHEAR_NDK_PIN=r27d" >> "$GITHUB_ENV"
          echo "SHEAR_REQUIRE_MINISIGN=1" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: wallet
        run: flutter build apk --release --target-platform android-arm64 --build-name=${{ inputs.pin }}.0 --build-number=${{ inputs.build_number }}
      - name: Zip
        run: |
          python3 - <<'PY'
          import os, sys, zipfile, shutil
          sys.path.insert(0, "scripts/licenses")
          import release_notices
          pin = os.environ["PIN"]
          bundle = "wallet/build/linux/x64/release/bundle"
          dist = "dist"
          os.makedirs(dist, exist_ok=True)
          def add_tree(z, root):
              for dp, _, fns in os.walk(root):
                  for fn in fns:
                      p = os.path.join(dp, fn)
                      z.write(p, os.path.relpath(p, root))
          linux = os.path.join(dist, f"shear-wallet-{pin}-linux.zip")
          with zipfile.ZipFile(linux, "w", zipfile.ZIP_DEFLATED) as z:
              add_tree(z, bundle)
              release_notices.write_notices(z, ".")
          arch = os.path.join(dist, f"shear-wallet-{pin}-archlinux.zip")
          with zipfile.ZipFile(arch, "w", zipfile.ZIP_DEFLATED) as z:
              z.write("wallet/pack/archlinux/PKGBUILD", "PKGBUILD")
              add_tree(z, bundle)
              release_notices.write_notices(z, ".")
          for path in (linux, arch):
              release_notices.assert_has_notices(zipfile.ZipFile(path).namelist(), ".")
              release_notices.assert_linux_zip_clean(path)
          apk = "wallet/build/app/outputs/flutter-apk/app-release.apk"
          shutil.copy(apk, os.path.join(dist, f"shear-wallet-{pin}-android.apk"))
          PY
        env:
          PIN: ${{ inputs.pin }}
      - name: Refuse a release APK that is not the pinned Continuum cert
        run: python3 wallet/pack/check_android_release.py dist/shear-wallet-${{ inputs.pin }}-android.apk
      - name: Refuse a release artifact without libshear_v3
        run: |
          python3 wallet/pack/check_shear_v3_bundled.py dist/shear-wallet-${{ inputs.pin }}-linux.zip
          python3 wallet/pack/check_shear_v3_bundled.py dist/shear-wallet-${{ inputs.pin }}-android.apk
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ inputs.pin }} dist/shear-wallet-${{ inputs.pin }}-linux.zip dist/shear-wallet-${{ inputs.pin }}-archlinux.zip dist/shear-wallet-${{ inputs.pin }}-android.apk --repo ${{ inputs.repo }}
          if [ -f wallet/dist-cli/shear ]; then gh release upload ${{ inputs.pin }} wallet/dist-cli/shear --repo ${{ inputs.repo }}; fi

  release-notes:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record the bundled runtime versions in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          gh release download ${{ inputs.pin }} --repo ${{ inputs.repo }} --dir /tmp/assets \
            --pattern 'shear-wallet-${{ inputs.pin }}-*.zip' --pattern 'shear-wallet-${{ inputs.pin }}-*.apk'
          python3 scripts/licenses/release_notes_versions.py /tmp/assets/* > /tmp/versions.md
          cat /tmp/versions.md
          gh release view ${{ inputs.pin }} --repo ${{ inputs.repo }} --json body -q .body > /tmp/notes.md
          { echo; cat /tmp/versions.md; } >> /tmp/notes.md
          gh release edit ${{ inputs.pin }} --repo ${{ inputs.repo }} --notes-file /tmp/notes.md

  macos:
    if: false
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Build macOS GUI zip + CLI
        working-directory: wallet
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          dart run tool/checkpoint_guard.dart --release
          bash ../native/build-shear-v3.sh
          flutter build macos --release --build-name=${{ inputs.pin }} --build-number=${{ inputs.build_number }} --dart-define=SHEAR_ADMIT_SIGN_ID="Developer ID Application: Russell Sneddon (SFCBP95595)"
          mkdir -p build/macos/Build/Products/Release/Shear.app/Contents/Frameworks
          cp ../native/libshear_v3.dylib build/macos/Build/Products/Release/Shear.app/Contents/Frameworks/libshear_v3.dylib
          dart compile exe bin/shear.dart -o dist-cli/shear
          mkdir -p ../dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/Shear.app ../dist/shear-wallet-${{ inputs.pin }}-macos.zip
          python3 pack/check_shear_v3_bundled.py ../dist/shear-wallet-${{ inputs.pin }}-macos.zip
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ inputs.pin }} dist/shear-wallet-${{ inputs.pin }}-macos.zip wallet/dist-cli/shear --repo ${{ inputs.repo }}
          echo "Notarized DMG is still a Mac-cut (Developer ID). This job attaches the unsigned-to-GHA .app zip + CLI."
