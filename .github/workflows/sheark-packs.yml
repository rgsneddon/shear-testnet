# ShearK-Miner packs for every OS the node ships, named from SHEAR_VERSION in
# sheark-miner/src/shear_hash.h. Artifacts only.
# This workflow does not create a release and does not move any tag.
# The linux job runs sheark-miner/tests/pack_linux.js and the windows job runs
# sheark-miner/tests/pack_windows.js. Each builds its zip with the repo's own
# packer and checks it, and fails (never skips) on any other OS.
name: sheark-packs
on:
  workflow_dispatch:
  push:
    branches: [main, feat/shear-testnet-v12]
    paths:
      - 'sheark-miner/**'
      - 'crypto/randomx/**'
      - 'scripts/licenses/**'
      - 'scripts/randomx_build.sh'
      - 'scripts/isa_scan.py'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'LICENSES/**'
      - '.github/workflows/sheark-packs.yml'
  pull_request:
    paths:
      - 'sheark-miner/**'
      - 'crypto/randomx/**'
      - 'scripts/licenses/**'
      - 'scripts/randomx_build.sh'
      - 'scripts/isa_scan.py'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'LICENSES/**'
      - '.github/workflows/sheark-packs.yml'

concurrency:
  group: sheark-packs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    # ubuntu-latest (the ubuntu-26.04 image) sets APT::Architecture-Variants
    # "amd64v3", so its gcc defaults to x86-64-v3 and its static libstdc++ and
    # libgcc are AVX2 builds that no -march flag can undo. ubuntu-24.04 builds
    # at the x86-64 baseline; scripts/isa_scan.py fails the job if that drifts.
    # Proven fallback: the ubuntu:26.04 container (baseline toolchain).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pack version
        run: echo "SHEARK_VER=$(sed -n 's/^#define SHEAR_VERSION "\([^"]*\)".*/\1/p' sheark-miner/src/shear_hash.h)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, selftest, pack, and check the Ubuntu zip
        run: |
          set -euo pipefail
          test -n "$SHEARK_VER"
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libsodium-dev pkg-config python3 patchelf
          make -C sheark-miner CC=gcc CXX=g++
          python3 scripts/isa_scan.py sheark-miner/src/*.o sheark-miner/ShearK-Miner crypto/randomx/build/librandomx.a
          bash sheark-miner/pack/selftest.sh sheark-miner/ShearK-Miner
          node sheark-miner/tests/pack_linux.js
          bash sheark-miner/pack/smoke_zip.sh "dist/ShearK-Miner-${SHEARK_VER}-linux.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ShearK-Miner-${{ env.SHEARK_VER }}-linux
          path: dist/ShearK-Miner-${{ env.SHEARK_VER }}-linux.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # MINGW64 OpenSSL: the exe imports libssl-3-x64.dll and libcrypto-3-x64.dll
      # (the Makefile and zip_windows.py read OPENSSL_BIN for their directory).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-python
      - name: Pack version
        run: echo "SHEARK_VER=$(sed -n 's/^#define SHEAR_VERSION "\([^"]*\)".*/\1/p' sheark-miner/src/shear_hash.h)" >> "$GITHUB_ENV"
      - name: Build, selftest, pack, and check the Windows zip
        run: |
          set -euo pipefail
          test -n "$SHEARK_VER"
          export PATH="/mingw64/bin:$PATH"
          export OPENSSL_BIN="$(cygpath -m /mingw64/bin)"
          export OPENSSL_INC="$(cygpath -m /mingw64/include)"
          test -f "$OPENSSL_BIN/libssl-3-x64.dll"
          test -f "$OPENSSL_BIN/libcrypto-3-x64.dll"
          command -v gcc objdump cmake mingw32-make python node
          mingw32-make -C sheark-miner CC=gcc CXX=g++
          python scripts/isa_scan.py sheark-miner/src/*.o sheark-miner/ShearK-Miner.exe crypto/randomx/build/librandomx.a
          st="$(./sheark-miner/ShearK-Miner.exe --backend interpreter --selftest)"
          echo "$st"
          grep -q 'selftest ok e9e9dee13e2240383e0bdfb65ae962f52d9962a2e3bebd7623d418464ceb8cd4' <<< "$st"
          node sheark-miner/tests/pack_windows.js
          # The exe in the shipped zip: the one selftested above, at the baseline.
          python scripts/scan_shipped_zip.py "dist/ShearK-Miner-$SHEARK_VER-windows.zip" --built ShearK-Miner.exe=sheark-miner/ShearK-Miner.exe ShearK-Miner.exe
      # R41: a manual run (workflow_dispatch) also benches the Windows exe
      # against the R28 base (13fb9376) on the same runner, and checks the
      # golden digest corpus and the vectors. Push and PR runs skip it.
      - name: R41 bench and vectors (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          export PATH="/mingw64/bin:$PATH"
          export OPENSSL_BIN="$(cygpath -m /mingw64/bin)"
          export OPENSSL_INC="$(cygpath -m /mingw64/include)"
          powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors,L2CacheSize,L3CacheSize,MaxClockSpeed; (Get-CimInstance Win32_OperatingSystem).Caption"
          rxb() {
            gcc -march=x86-64 -mtune=generic -O3 -std=c11 -pthread -I"$1/sheark-miner/src" -I"$1/crypto/randomx/src" -c -o "$1/sheark-miner/bench-rxbench.o" sheark-miner/bench/rxbench.c
            g++ -march=x86-64 -mtune=generic -O3 -pthread -o "$1/sheark-miner/bench/rxbench.exe" "$1/sheark-miner/bench-rxbench.o" \
              "$1/sheark-miner/src/shear_hash.o" "$1/sheark-miner/src/sha256.o" "$1/sheark-miner/src/sha512.o" "$1/crypto/randomx/build/librandomx.a" \
              -static-libgcc -static-libstdc++ -Wl,-Bstatic,--whole-archive -lwinpthread -Wl,--no-whole-archive,-Bdynamic
          }
          git fetch --no-tags --depth=1 origin 13fb937689aa778cbf8dcca5253b819e531f7c27
          git worktree add ../r41-base FETCH_HEAD
          mingw32-make -C ../r41-base/sheark-miner CC=gcc CXX=g++
          mkdir -p ../r41-base/sheark-miner/bench
          rxb ../r41-base
          rxb .
          for i in 1 2; do
            for t in ../r41-base .; do
              echo "== $t pass $i"
              "$t/sheark-miner/bench/rxbench.exe" --backend jit-full --threads 1,2,3,4 --secs 20 --warm 5 --epochs 3
            done
          done
          for b in interpreter jit jit-full; do ./sheark-miner/bench/rxbench.exe --backend $b --golden sheark-miner/bench/golden_v12.txt --threads 0; done
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 sheark-miner/tests/test_golden_corpus_v12.js sheark-miner/tests/test_sha512_fips_v12.js sheark-miner/tests/test_blunote_vectors_v12.js sheark-miner/tests/test_miner.js
          node sheark-miner/bench/stratum_bench.mjs --mode pool --miner "$(pwd)/sheark-miner/ShearK-Miner.exe" --secs 180 --sample 30 || echo "stratum bench (pool) failed on Windows"
          node sheark-miner/bench/stratum_bench.mjs --mode refusals --miner "$(pwd)/sheark-miner/ShearK-Miner.exe" || echo "stratum bench (refusals) failed on Windows"
      - uses: actions/upload-artifact@v4
        with:
          name: ShearK-Miner-${{ env.SHEARK_VER }}-windows
          path: dist/ShearK-Miner-${{ env.SHEARK_VER }}-windows.zip
          if-no-files-found: error

  distro:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: archlinux
            image: archlinux:base
          - flavor: fedora
            image: fedora:latest
          - flavor: opensuse
            image: opensuse/tumbleweed
    steps:
      - uses: actions/checkout@v4
      - name: Pack version
        run: echo "SHEARK_VER=$(sed -n 's/^#define SHEAR_VERSION "\([^"]*\)".*/\1/p' sheark-miner/src/shear_hash.h)" >> "$GITHUB_ENV"
      - name: Build and pack inside the distro image
        run: |
          test -n "$SHEARK_VER"
          cat > "$RUNNER_TEMP/pack-sheark.sh" << 'ENDSCRIPT'
          #!/bin/bash
          set -euo pipefail
          echo "FLAVOR=$FLAVOR SHEARK_VER=$SHEARK_VER"
          cat /etc/os-release
          case "$FLAVOR" in
            archlinux)
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel cmake openssl libsodium python git patchelf
              ;;
            fedora)
              dnf -y install gcc gcc-c++ make cmake openssl-devel libsodium-devel python3 git zip file patchelf pkgconf-pkg-config libstdc++-static
              ;;
            opensuse)
              zypper -n refresh
              zypper -n install gcc gcc-c++ make cmake libopenssl-devel libsodium-devel python3 git zip file patchelf pkg-config
              ;;
            *)
              echo "unknown flavor $FLAVOR" >&2
              exit 1
              ;;
          esac
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v python3.13 >/dev/null 2>&1; then
              ln -sf "$(command -v python3.13)" /usr/local/bin/python3
            elif command -v python >/dev/null 2>&1; then
              ln -sf "$(command -v python)" /usr/local/bin/python3
            else
              echo "python3 missing" >&2
              exit 1
            fi
          fi
          cd /src
          rm -rf crypto/randomx/build sheark-miner/ShearK-Miner sheark-miner/src/*.o
          make -C sheark-miner CC=gcc CXX=g++
          python3 scripts/isa_scan.py sheark-miner/src/*.o sheark-miner/ShearK-Miner crypto/randomx/build/librandomx.a
          bash sheark-miner/pack/selftest.sh sheark-miner/ShearK-Miner
          python3 sheark-miner/pack/zip_unix.py "$FLAVOR"
          bash sheark-miner/pack/smoke_zip.sh "dist/ShearK-Miner-${SHEARK_VER}-${FLAVOR}.zip"
          ENDSCRIPT
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -v "$RUNNER_TEMP/pack-sheark.sh":/pack-sheark.sh:ro \
            -e FLAVOR="${{ matrix.flavor }}" \
            -e SHEARK_VER="$SHEARK_VER" \
            "${{ matrix.image }}" \
            bash /pack-sheark.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ShearK-Miner-${{ env.SHEARK_VER }}-${{ matrix.flavor }}
          path: dist/ShearK-Miner-${{ env.SHEARK_VER }}-${{ matrix.flavor }}.zip
          if-no-files-found: error
