server {
    listen 80;
    listen [::]:80;
    server_name shear.digital www.shear.digital;
    root /var/www/shear.digital;
    index index.html;
    location ~* \.woff2$ { default_type font/woff2; }
    location = /reserve/latest.json {
        alias /opt/shear-v2/reserve/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location / { try_files $uri $uri/ =404; }
}
