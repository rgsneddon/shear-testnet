server {
    listen 80;
    listen [::]:80;
    server_name shear.digital www.shear.digital;
    root /var/www/shear.digital;
    index index.html;
    access_log /var/log/nginx/shear.digital.access.log shear_noqs;
    location ~* \.woff2$ { default_type font/woff2; }
    location = /reserve/latest.json {
        alias /opt/shear-v4/reserve/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location = /api/stats {
        proxy_pass http://127.0.0.1:8088/api/stats;
        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_cache shear_stats;
        proxy_cache_valid 200 1s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_lock on;
        add_header Cache-Control "no-store";
        add_header X-Stats-Cache $upstream_cache_status;
    }
    location / { try_files $uri $uri/ =404; }
    # When TLS terminates here (certbot 443), also send:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
