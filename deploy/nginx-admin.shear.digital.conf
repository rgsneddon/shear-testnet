# admin.shear.digital — Shear how-to (wallet, mine, The Reserve).
# Static. Not GOD. Not the rpAI loopback.

server {
    listen 80;
    listen [::]:80;
    server_name admin.shear.digital;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.shear.digital;
    ssl_certificate /etc/letsencrypt/live/admin.shear.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.shear.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/admin.shear.digital;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
