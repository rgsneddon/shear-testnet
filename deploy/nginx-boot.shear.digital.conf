# boot.shear.digital — latest prune bootstrap only (overwrite, no history).
server {
    listen 80;
    listen [::]:80;
    server_name boot.shear.digital;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name boot.shear.digital;
    root /var/www/boot.shear.digital;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/boot.shear.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boot.shear.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /brand/ {
        alias /var/www/shear.digital/brand/;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /latest.json {
        alias /var/lib/shear/testnet-v5/bootstrap/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location = /latest.bin {
        alias /var/lib/shear/testnet-v5/bootstrap/latest.bin;
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
        add_header Content-Disposition "attachment; filename=latest.bin";
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
