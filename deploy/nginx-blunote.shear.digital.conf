# blunote.shear.digital: BluNotes (Russell 27 Oct). The page dag.shear.digital
# served, unchanged for now; its copy is rewritten after R28 is signed off.
server {
    listen 80;
    listen [::]:80;
    server_name blunote.shear.digital;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/blunote.shear.digital;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    listen [::1]:8443 ssl;
    server_name blunote.shear.digital;
    location ~* \.bak { return 404; }  # backups are never served (Russell 27 Oct)
    root /var/www/blunote.shear.digital;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/blunote.shear.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blunote.shear.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    location ~* \.woff2$ { default_type font/woff2; add_header Cache-Control "public, max-age=604800"; }
    location /brand/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
