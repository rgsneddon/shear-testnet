# Public pin is stratum+ssl://pool.shear.digital:443.
# Public TCP 1113 does not arrive at this host. 443 does.
# Stream peeks the ClientHello and sends browser ALPN to the local HTTPS
# listeners on 127.0.0.1:8443. No ALPN (ShearK stratum+ssl) goes to the pool
# TLS listener on 127.0.0.1:1113. Cleartext stratum stays on :1111.
# Those https server blocks must listen on 8443, not public 443, or bind fails.

stream {
    upstream stratum_edge_web { server 127.0.0.1:8443; }
    upstream stratum_edge_pool { server 127.0.0.1:1113; }
    map $ssl_preread_alpn_protocols $stratum_upstream {
        ~h2                    stratum_edge_web;
        ~http/1\.1             stratum_edge_web;
        default                stratum_edge_pool;
    }
    server {
        listen 443;
        listen [::]:443 ipv6only=on;
        proxy_pass $stratum_upstream;
        ssl_preread on;
        proxy_connect_timeout 2s;
        proxy_timeout 24h;
    }
}
