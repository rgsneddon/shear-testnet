# r2r.shear.digital — validating satellite hostname. No public pool, no public site.
server {
    listen 80;
    listen [::]:80;
    server_name r2r.shear.digital;
    root /var/www/r2r.shear.digital;
    index index.html;
    access_log /var/log/nginx/r2r.shear.digital.access.log shear_noqs;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    # continuum-rpc-18332 — Bare reads JSON from this seed. / stays the static page.
    # Loopback node RPC only. Do not proxy the pool listener.
    location = /stats { proxy_pass http://127.0.0.1:18332; }
    location = /api/stats { proxy_pass http://127.0.0.1:18332; }
    location = /getstats { proxy_pass http://127.0.0.1:18332; }
    location = /headers { proxy_pass http://127.0.0.1:18332; }
    location = /getheaders { proxy_pass http://127.0.0.1:18332; }
    location = /api/explorer/headers { proxy_pass http://127.0.0.1:18332; }
    location = /header { proxy_pass http://127.0.0.1:18332; }
    location = /getheader { proxy_pass http://127.0.0.1:18332; }
    location = /api/explorer/header { proxy_pass http://127.0.0.1:18332; }
    location = /blocks { proxy_pass http://127.0.0.1:18332; }
    location = /getblocks { proxy_pass http://127.0.0.1:18332; }
    location = /compactblocks { proxy_pass http://127.0.0.1:18332; }
    location = /block { proxy_pass http://127.0.0.1:18332; }
    location = /getblock { proxy_pass http://127.0.0.1:18332; }
    location = /compactblock { proxy_pass http://127.0.0.1:18332; }
    location = /jroot { proxy_pass http://127.0.0.1:18332; }
    location = /getjroot { proxy_pass http://127.0.0.1:18332; }
    location = /api/wallet/jroot { proxy_pass http://127.0.0.1:18332; }
    location = /fluxset { proxy_pass http://127.0.0.1:18332; }
    location = /getfluxset { proxy_pass http://127.0.0.1:18332; }
    location = /api/wallet/fluxset { proxy_pass http://127.0.0.1:18332; }
    location = /notes { proxy_pass http://127.0.0.1:18332; }
    location = /getnotes { proxy_pass http://127.0.0.1:18332; }
    location = /api/wallet/notes { proxy_pass http://127.0.0.1:18332; }
    location = /api/wallet/balance { proxy_pass http://127.0.0.1:18332; }
    location = /api/wallet/history { proxy_pass http://127.0.0.1:18332; }
    location = /api/wallet/send { proxy_pass http://127.0.0.1:18332; }
    location = /api/wallet/register { proxy_pass http://127.0.0.1:18332; }
    location = /events {
        proxy_pass http://127.0.0.1:18332;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
