# dag.shear.digital: moved to blunote.shear.digital (BluNotes, Russell 27 Oct).
# A 301 to the same path until Russell deletes this name; then this block, its
# certificate SAN and /var/www/dag.shear.digital go (R18a teardown list).
server {
    listen 80;
    listen [::]:80;
    server_name dag.shear.digital;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/dag.shear.digital;
    }

    location / {
        return 301 https://blunote.shear.digital$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    listen [::1]:8443 ssl;
    server_name dag.shear.digital;

    ssl_certificate /etc/letsencrypt/live/shear.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shear.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://blunote.shear.digital$request_uri;
    }
}
