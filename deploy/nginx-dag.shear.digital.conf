# dag.shear.digital — static vhost, same shape as live mempool.
# Enabled on shear-pool 2026-09-26. The shear.digital certificate lists this name.
# Do not issue a dag-only cert over /etc/letsencrypt/live/shear.digital/.
# Do not proxy this host at the pool (127.0.0.1:8088) or vortices (127.0.0.1:8791).
# Do not add this hostname to the shear.digital navbar.

server {
    listen 80;
    listen [::]:80;
    server_name dag.shear.digital;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/dag.shear.digital;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dag.shear.digital;
    root /var/www/dag.shear.digital;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/shear.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shear.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    location ~* \.woff2$ { default_type font/woff2; add_header Cache-Control "public, max-age=604800"; }
    location /brand/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
