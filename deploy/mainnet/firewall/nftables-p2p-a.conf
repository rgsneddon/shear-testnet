#!/usr/sbin/nft -f
# p2p-a (Debian stable): nftables, inbound TCP 22, 80, 443, 1111 and 30303
# only, IPv4 and IPv6 (inet family). Everything else inbound is dropped. 8080
# is closed (RUNBOOK, "Port 8080").
# R18a, deploy/mainnet/RUNBOOK.md step 7. Installed as /etc/nftables.conf only
# on Russell's GO; check it first with `nft -c -f nftables-p2p-a.conf`, then
# `systemctl enable --now nftables` so it loads at every boot.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    tcp dport { 22, 80, 443, 1111, 30303 } accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
