#!/usr/sbin/nft -f
# p2p-a (Debian stable): nftables, inbound TCP 22 (rate limited) and 30303
# only, IPv4 and IPv6 (inet family). Everything else inbound is dropped. A
# p2p host serves no site and no stratum, so 80, 443 and 1111 stay closed.
# 8080 is closed (RUNBOOK, "Port 8080").
# R18a, deploy/mainnet/RUNBOOK.md step 7. Installed as /etc/nftables.conf only
# on Russell's GO; check it first with `nft -c -f nftables-p2p-a.conf`, then
# `systemctl enable --now nftables` so it loads at every boot.
flush ruleset

table inet filter {
  # New SSH connections per source address: over 10 a minute (burst 5) are
  # dropped. Entries expire after a minute.
  set ssh4 { type ipv4_addr; flags dynamic; timeout 1m; }
  set ssh6 { type ipv6_addr; flags dynamic; timeout 1m; }
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    meta nfproto ipv4 tcp dport 22 ct state new add @ssh4 { ip saddr limit rate over 10/minute burst 5 packets } drop
    meta nfproto ipv6 tcp dport 22 ct state new add @ssh6 { ip6 saddr limit rate over 10/minute burst 5 packets } drop
    tcp dport { 22, 30303 } accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
