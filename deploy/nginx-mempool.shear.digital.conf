server {
    listen 80;
    listen [::]:80;
    server_name mempool.shear.digital;
    root /var/www/mempool.shear.digital;
    index index.html;
    location ~* \.woff2$ { default_type font/woff2; }
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store";
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
