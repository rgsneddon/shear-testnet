server {
    listen 80;
    listen [::]:80;
    server_name mempool.shear.digital;
    root /var/www/mempool.shear.digital;
    index index.html;
    gzip on;
    gzip_min_length 256;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    location ~* \.woff2$ { default_type font/woff2; add_header Cache-Control "public, max-age=604800"; }
    location /brand/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store";
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
