# /etc/nginx/conf.d/shear-stats-cache.conf
# Last-good /api/stats so the homepage and pool UI do not blank when the pool restarts.
proxy_cache_path /var/cache/nginx/shear-stats levels=1:2 keys_zone=shear_stats:1m max_size=8m inactive=1h use_temp_path=off;
# $uri is the path without query string, so dests in /api/wallet/?address=ssa1… do not join IP on disk.
log_format shear_noqs '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
