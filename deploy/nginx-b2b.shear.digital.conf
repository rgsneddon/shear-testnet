# b2b.shear.digital — validating satellite hostname. No public pool, no public site.
server {
    listen 80;
    listen [::]:80;
    server_name b2b.shear.digital;
    root /var/www/b2b.shear.digital;
    index index.html;
    access_log /var/log/nginx/b2b.shear.digital.access.log shear_noqs;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
