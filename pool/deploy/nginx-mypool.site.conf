# Example public pool for a generic hostname.
# Copy to /etc/nginx/sites-available/ and enable. Replace mypool.site
# and the certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name mypool.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mypool.site;
    ssl_certificate     /etc/letsencrypt/live/mypool.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypool.site/privkey.pem;

    root /opt/shear-pool/pool/public;
    index index.html;

    location /brand/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /fingerprint {
        proxy_pass http://127.0.0.1:8088/fingerprint;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ @pool;
    }
    location @pool {
        proxy_pass http://127.0.0.1:8088;
    }
}
