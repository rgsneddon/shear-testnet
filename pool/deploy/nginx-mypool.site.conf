# Example public pool + /admin desk for a generic hostname.
# Copy to /etc/nginx/sites-available/ and enable. Replace mypool.site
# and the certificate paths. Do not publish your real admin hostname
# in this file if you use a separate dedicated desk vhost.

server {
    listen 80;
    listen [::]:80;
    server_name mypool.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mypool.site;
    ssl_certificate     /etc/letsencrypt/live/mypool.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypool.site/privkey.pem;

    root /opt/shear-pool/pool/public;
    index index.html;

    location = /admin {
        proxy_pass http://127.0.0.1:8088/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8088/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /api/admin/ {
        proxy_pass http://127.0.0.1:8088/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store";
    }

    location /brand/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /fingerprint {
        proxy_pass http://127.0.0.1:8088/fingerprint;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ @pool;
    }
    location @pool {
        proxy_pass http://127.0.0.1:8088;
    }
}
