# TLS front for stratum. Testnet cleartext on :1111 is temporary.
# Bind the pool to 127.0.0.1:1111 (SHEAR_STRATUM_BIND) and terminate TLS here.
#
# stream { include /etc/nginx/nginx-stratum-tls.conf; }

upstream shear_stratum {
    server 127.0.0.1:1111;
}

server {
    listen 3333 ssl;
    listen [::]:3333 ssl;
    ssl_certificate     /etc/letsencrypt/live/mypool.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypool.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_pass shear_stratum;
    proxy_connect_timeout 5s;
}

# Caddy equivalent (Caddyfile):
# mypool.site:3333 {
#     bind 0.0.0.0
#     reverse_proxy 127.0.0.1:1111
# }
